name: Update silver prices

on:
  schedule:
    - cron: "7 */2 * * *"   # every 2 hours; see README to change
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-prices

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch prices
        run: node scripts/fetch.mjs
        env:
          METALPRICE_API_KEY: ${{ secrets.METALPRICE_API_KEY }}
      - name: Commit updated data
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add docs/data.json
          git diff --staged --quiet || (git commit -m "Update prices" && git push)
